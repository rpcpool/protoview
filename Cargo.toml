[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
bytes = "1.10"
clap = { version = "4.6", features = ["derive"] }
dotenvy = "0.15.7"
thiserror = "2.0"
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tokio-stream = "0.1.17"
tonic = { version = "0.14.6", default-features = false, features = ["channel", "codegen", "tls-ring", "tls-native-roots", "tls-webpki-roots"] }
proto-codec = { path = "crates/proto-codec" }
proto-codec-gen = { path = "crates/proto-codec-gen" }
prost = "0.14.4"
prost-types = "0.14.4"
protox = "0.9.1"
yellowstone-grpc-proto = { version = "=13.0.0", default-features = false }
