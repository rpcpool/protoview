// Every field type protoc accepts that codegen supports, in each of its three
// cardinalities: implicit presence (1-16), proto3 `optional` (21-36), and `repeated`
// (41-56). Field numbers above 15 also exercise two-byte tags.
syntax = "proto3";

package fixtures.all_types;

message Leaf {
    uint32 id = 1;
    string name = 2;
    repeated Leaf children = 3;
}

message AllTypes {
    double   f_double   = 1;
    float    f_float    = 2;
    int32    f_int32    = 3;
    int64    f_int64    = 4;
    uint32   f_uint32   = 5;
    uint64   f_uint64   = 6;
    sint32   f_sint32   = 7;
    sint64   f_sint64   = 8;
    fixed32  f_fixed32  = 9;
    fixed64  f_fixed64  = 10;
    sfixed32 f_sfixed32 = 11;
    sfixed64 f_sfixed64 = 12;
    bool     f_bool     = 13;
    string   f_string   = 14;
    bytes    f_bytes    = 15;
    Leaf     f_message  = 16;

    optional double   o_double   = 21;
    optional float    o_float    = 22;
    optional int32    o_int32    = 23;
    optional int64    o_int64    = 24;
    optional uint32   o_uint32   = 25;
    optional uint64   o_uint64   = 26;
    optional sint32   o_sint32   = 27;
    optional sint64   o_sint64   = 28;
    optional fixed32  o_fixed32  = 29;
    optional fixed64  o_fixed64  = 30;
    optional sfixed32 o_sfixed32 = 31;
    optional sfixed64 o_sfixed64 = 32;
    optional bool     o_bool     = 33;
    optional string   o_string   = 34;
    optional bytes    o_bytes    = 35;
    optional Leaf     o_message  = 36;

    repeated double   r_double   = 41;
    repeated float    r_float    = 42;
    repeated int32    r_int32    = 43;
    repeated int64    r_int64    = 44;
    repeated uint32   r_uint32   = 45;
    repeated uint64   r_uint64   = 46;
    repeated sint32   r_sint32   = 47;
    repeated sint64   r_sint64   = 48;
    repeated fixed32  r_fixed32  = 49;
    repeated fixed64  r_fixed64  = 50;
    repeated sfixed32 r_sfixed32 = 51;
    repeated sfixed64 r_sfixed64 = 52;
    repeated bool     r_bool     = 53;
    repeated string   r_string   = 54;
    repeated bytes    r_bytes    = 55;
    repeated Leaf     r_message  = 56;
}
