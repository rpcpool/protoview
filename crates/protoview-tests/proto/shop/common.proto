// The README's example schema, part 1. Kept here so the README's code is compiled and
// tested; keep the two in sync.
syntax = "proto3";

package shop.common;

message Money {
    string currency = 1;
    int64 units = 2;
    int32 nanos = 3;
}

message Address {
    string line1 = 1;
    string city = 2;
    string country = 3;
}
