// Implicit-presence scalars, strings, and a singular nested message: the first
// end-to-end codegen target per docs/design.md's build order.
syntax = "proto3";

package fixtures.nested;

message Inner {
    double ratio = 1;
    uint32 scale = 2;
    string text = 3;
    string alt_text = 4;
}

message Outer {
    uint32 id = 1;
    string name = 2;
    Inner inner = 3;
    string owner = 4;
    string label = 5;
}
